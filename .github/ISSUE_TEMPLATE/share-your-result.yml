name: Share your result
description: Tell us how Kickoff Compass worked in your AI app. Good and bad results both help.
title: "Result: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Please do not include passwords, keys or real personal data. Describe your idea in general terms.
  - type: dropdown
    id: ai
    attributes:
      label: Which AI did you use?
      options:
        - ChatGPT
        - Gemini
        - Claude
        - Microsoft Copilot
        - GitHub Copilot
        - Cursor
        - Codex
        - Gemini CLI
        - Claude Code
        - Other (say which below)
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How did you use it?
      options:
        - Installed with npx skills add
        - Pasted the prompt into a chat
        - Saved it as a custom GPT, Gem or Project
        - Other
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Your experience with software
      options:
        - Beginner
        - Some experience
        - Experienced engineer
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What did you ask it to plan? (general terms)
    validations:
      required: true
  - type: textarea
    id: worked
    attributes:
      label: What worked well?
  - type: textarea
    id: wrong
    attributes:
      label: What felt wrong, too long or confusing?
      description: For example too many questions at once, started building too early, ignored a rule, lost your progress.
  - type: checkboxes
    id: safe
    attributes:
      label: Before you submit
      options:
        - label: I removed passwords, keys and real personal data.
          required: true
